worker_processes  1;

events {
    worker_connections  1024;
}

http {
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        application/pdf pdf;
    }
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100m;

    # Abuse protection, not a normal-traffic throttle — legitimate requests are
    # low-frequency (one submission takes minutes end-to-end); this just blunts
    # rapid-fire scanning/retries. burst allows short bursts before limiting kicks in.
    limit_req_zone $binary_remote_addr zone=appraisal_limit:10m rate=10r/s;

    upstream appraisal_backend {
        server app1:8000;
        server app2:8000;
        server app3:8000;
        # server app4:8000;
        # server app5:8000;
        # server app6:8000;
    }

    server {
        listen 8080;
        server_name localhost;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Uncomment once real TLS certs are mounted (see docker-compose.yml's
        # commented ./nginx/certs volume + "443:443" port).
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=appraisal_limit burst=20 nodelay;

            proxy_pass http://appraisal_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 900s;
            proxy_connect_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
