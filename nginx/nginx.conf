worker_processes  1;

events {
    worker_connections  1024;
}

http {
    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        application/pdf pdf;
    }
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100m;

    # Abuse protection, not a normal-traffic throttle — legitimate requests are
    # low-frequency (one submission takes minutes end-to-end); this just blunts
    # rapid-fire scanning/retries. burst allows short bursts before limiting kicks in.
    limit_req_zone $binary_remote_addr zone=appraisal_limit:10m rate=10r/s;

    server {
        listen 8080;
        server_name localhost;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Uncomment once real TLS certs are available (internal/VPN deployments
        # may not need this if TLS is already terminated upstream). Also add a
        # `listen 8080;` -> redirect server block if enforcing HTTPS-only.
        # listen 8443 ssl;
        # ssl_certificate     /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            limit_req zone=appraisal_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Must stay above PDF_MASK_TIMEOUT_SECONDS + AZURE_REQUEST_TIMEOUT_SECONDS
            # (worst case ~600s + 300s), otherwise nginx cuts the request before the
            # backend's own timeout has a chance to fire.
            proxy_read_timeout 900s;
            proxy_connect_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
